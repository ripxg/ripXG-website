name: Post new blog posts to Twitter/X

on:
  push:
    branches:
      - main
    paths:
      - 'content/blog/**/*.mdx'
      - 'content/blog/**/*.md'

jobs:
  post-to-twitter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get new/modified blog files
        id: changed
        run: |
          # For merge commits, compare against the merge base of both parents
          if git rev-parse HEAD^2 >/dev/null 2>&1; then
            # It's a merge commit — diff between the two parents
            BASE=$(git merge-base HEAD^1 HEAD^2)
            FILES=$(git diff --name-only "$BASE" HEAD -- 'content/blog/*.mdx' 'content/blog/*.md' 'content/blog/**/*.mdx' 'content/blog/**/*.md')
          else
            # Regular commit
            FILES=$(git diff --name-only HEAD~1 HEAD -- 'content/blog/*.mdx' 'content/blog/*.md' 'content/blog/**/*.mdx' 'content/blog/**/*.md')
          fi
          echo "Detected files: $FILES"
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Post to Twitter/X
        if: steps.changed.outputs.files != ''
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: |
          for FILE in ${{ steps.changed.outputs.files }}; do
            echo "Posting $FILE..."
            npx ts-node scripts/post-to-twitter.ts "$FILE" || echo "Failed for $FILE, continuing..."
          done
